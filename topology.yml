name: seed-buffer-overflow-lab

hosts:
  - name: victim
    base_box:
      image: SEEDUbuntu-16.04-32bit
      mgmt_user: debian
    flavor: m1.medium

routers:
  - name: victim-router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  - name: internet-connection
    cidr: 100.100.100.0/24

networks:
  - name: lab-switch
    cidr: 10.1.26.0/24

net_mappings:
  - host: victim
    network: lab-switch
    ip: 10.1.26.10

router_mappings:
  - router: victim-router
    network: internet-connection
    ip: 100.100.100.1
  - router: victim-router
    network: lab-switch
    ip: 10.1.26.1

groups: []
